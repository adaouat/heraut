# yaml-language-server: $schema=https://raw.githubusercontent.com/adaouat/heraut/main/schema.json

version: "1"

versioning:
  strategy: semver
  tag_prefix: "v"
  initial_version: "0.1.0"
  bump: auto

changelog:
  generator: git-cliff
  output: CHANGELOG.md

release:
  notes:
    generator: git-cliff
  platforms:
    - platform: github
      name: github
      repository: acme/widget
      base_url: https://github.com
      token_env: GH_TOKEN
    - platform: gitlab
      name: gitlab
      project: acme/widget
      base_url: https://gitlab.com
      token_env: GITLAB_TOKEN
