# yaml-language-server: $schema=https://raw.githubusercontent.com/adaouat/heraut/main/schema.json

version: "1"

versioning:
  strategy: semver
  tag_prefix: "v"
  initial_version: "0.1.0"
  bump: auto

changelog:
  output: CHANGELOG.md

forges:
  - name: github
    platform: github
    repository: acme/widget
    base_url: https://github.com
    token_env: GH_TOKEN
  - name: gitlab
    platform: gitlab
    project: acme/widget
    base_url: https://gitlab.com
    token_env: GITLAB_TOKEN

commits:
  enrichment_forge: github

release:
  notes: {}
  targets:
    - forge: github
    - forge: gitlab
