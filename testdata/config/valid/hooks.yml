# yaml-language-server: $schema=https://raw.githubusercontent.com/adaouat/heraut/main/schema.json

version: "1"

versioning:
  strategy: semver
  bump:
    mode: auto

changelog:
  output: CHANGELOG.md

hooks:
  post_bump:
    - run: "echo {{ .Version }} > VERSION"
      stage:
        - VERSION
  pre_changelog:
    - run: "make lint"
  pre_tag:
    - run: "go build ./..."
  post_tag:
    - run: "echo tagged {{ .Tag }}"
  pre_release:
    - run: "echo about to publish to {{ .Platform }}"
  post_release:
    - run: "echo released {{ .Tag }} to {{ .Platform }}"
