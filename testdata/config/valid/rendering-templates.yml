# yaml-language-server: $schema=https://raw.githubusercontent.com/adaouat/heraut/main/schema.json

version: "1"

versioning:
  strategy: semver

changelog:
  output: CHANGELOG.md

rendering:
  templates:
    title: "# Changelog"
    subtitle: "All notable changes to this project."
    release_notes: '{{range .Groups}}{{ template "release.group" . }}{{end}}'
    release:
      section: "## {{ .Version }}"
      group: "{{ .HeadingPrefix }} {{ .Name }}"
    commit:
      message: "- {{ .Description }} ({{ .ShortHash }})"
