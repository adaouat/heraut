# yaml-language-server: $schema=https://raw.githubusercontent.com/adaouat/heraut/main/schema.json

version: "1"

versioning:
  strategy: semver

changelog: {}

commits:
  tickets:
    - name: jira
      pattern: '[A-Z]{2,}-[0-9]+'
      url: 'https://acme.atlassian.net/browse/{ticket}'
  rules:
    - name: no-wip
      deny: '(?i)\bwip\b'
      message: "commit message must not contain WIP"
    - name: require-ticket-on-fix
      require_ticket: true
      target: footer
      types: [fix]
      message: "fix commits must reference a ticket in a footer trailer (e.g. Refs: JIRA-123)"
    - name: no-breaking
      is_breaking: true
      refuse: true
    - name: docs-need-jira
      types: [docs]
      require_ticket: true
      tickets: [jira]
    - name: others-need-a-ticket
      except_types: [docs]
      except_scopes: [deps]
      require_ticket: true
