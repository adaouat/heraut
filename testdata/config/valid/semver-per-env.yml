version: "1"

versioning:
  strategy: semver-per-env
  tag_format: "{env}/{version}"
  environments:
    dev:
      branch: develop
      bump: auto
      disable_changelog: true
    staging:
      branch: main
      bump: promote
      source: dev
    prod:
      branch: main
      bump: promote
      source: staging

changelog:
  generator: git-cliff
  output: CHANGELOG.md
  tag_pattern: "dev/*"

release:
  notes:
    generator: git-cliff
    tag_pattern: "dev/*"
  platforms:
    - platform: gitlab

environments:
  dev:
    release:
      platforms:
        - platform: gitlab
  prod:
    release:
      platforms:
        - platform: gitlab
        - platform: github
