version: "1"

versioning:
  strategy: semver-per-env
  tag_format: "{env}/{version}"

forges:
  - name: gitlab
    platform: gitlab
  - name: github
    platform: github

commits:
  enrichment_forge: gitlab

environments:
  dev:
    branch: develop
    bump: auto
    disable_changelog: true
    release:
      targets:
        - forge: gitlab
  staging:
    branch: main
    bump: promote
    source: dev
  prod:
    branch: main
    bump: promote
    source: staging
    release:
      targets:
        - forge: gitlab
        - forge: github

changelog:
  generator: git-cliff
  output: CHANGELOG.md
  tag_pattern: "dev/*"

release:
  notes:
    generator: git-cliff
    tag_pattern: "dev/*"
  targets:
    - forge: gitlab
