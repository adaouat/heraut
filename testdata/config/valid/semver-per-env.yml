version: "1"

versioning:
  strategy: semver-per-env
  tag_format: "{env}/{version}"

environments:
  dev:
    branch: develop
    bump: auto
    disable_changelog: true
    release:
      platforms:
        - platform: gitlab
          name: gitlab
  staging:
    branch: main
    bump: promote
    source: dev
  prod:
    branch: main
    bump: promote
    source: staging
    release:
      platforms:
        - platform: gitlab
          name: gitlab
        - platform: github
          name: github

changelog:
  generator: git-cliff
  output: CHANGELOG.md
  tag_pattern: "dev/*"

release:
  notes:
    generator: git-cliff
    tag_pattern: "dev/*"
  platforms:
    - platform: gitlab
      name: gitlab
