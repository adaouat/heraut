# git-cliff ~ configuration file (release notes variant)
# https://git-cliff.org/docs/configuration

[changelog]
# Release notes are scoped to a single release; the platform already renders
# the version heading, so no header is needed here.
header = ""

body = """
{%- macro remote_url() -%}
  {{ get_env(name="CI_PROJECT_URL", default=get_env(name="GITHUB_SERVER_URL", default="") ~ "/" ~ get_env(name="GITHUB_REPOSITORY", default="")) }}
{%- endmacro -%}

{%- macro pr_link(number) -%}
  {%- if get_env(name="CI_PROJECT_URL", default="") != "" -%}
    [!{{ number }}]({{ self::remote_url() }}/-/merge_requests/{{ number }})
  {%- else -%}
    [#{{ number }}]({{ self::remote_url() }}/pulls/{{ number }})
  {%- endif -%}
{%- endmacro -%}

{% macro print_commit(commit) -%}
    - {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
        {% if commit.breaking %}[**breaking**] {% endif %}\
        {{ commit.message | upper_first }} - \
        ([{{ commit.id | truncate(length=7, end="") }}]({{ self::remote_url() }}/commit/{{ commit.id }}))\
        {% if commit.remote.username %} by @{{ commit.remote.username }}{%- endif %}\
        {%- if commit.remote.pr_number %} in {{ self::pr_link(number=commit.remote.pr_number) }}{%- endif %}
        {% if commit.body %}
          {{ commit.body | indent(first=true) }}
        {% endif %}\
        {% if commit.footers %}
            {% for footer in commit.footers -%}
                {% raw %}  {% endraw %}{{ footer.token }}{{ footer.separator }}{{ footer.value }}\
            {% endfor %}\
        {% endif %}\
        {% if commit.body or commit.footers %}\n{% endif %}\
{% endmacro -%}

{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [unreleased]
{% endif %}\

{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits
    | filter(attribute="scope")
    | sort(attribute="scope") %}
        {{ self::print_commit(commit=commit) }}
    {%- endfor %}
    {% for commit in commits %}
        {%- if not commit.scope -%}
            {{ self::print_commit(commit=commit) }}
        {% endif -%}
    {% endfor -%}
{% endfor -%}
{% if gitlab.contributors | filter(attribute="is_first_time", value=true) | length != 0 %}
  ### New Contributors ❤️
{% for contributor in gitlab.contributors | filter(attribute="is_first_time", value=true) %}
  * @{{ contributor.username }} made their first contribution
    {%- if contributor.pr_number %} in \
      {{ self::pr_link(number=contributor.pr_number) }} \
    {%- endif %}
{%- endfor -%}\
{%- endif %}
### Commit Statistics\n
- {{ statistics.commit_count }} commit(s) contributed to the release.
- {{ statistics.commits_timespan | default(value=0) }} day(s) passed between the first and last commit.
- {{ statistics.conventional_commit_count }} commit(s) parsed as conventional.
- {{ statistics.links | length }} linked issue(s) detected in commits.
{%- if statistics.links | length > 0 %}
    {%- for link in statistics.links %}
        {{ "  " }}- [{{ link.text }}]({{ link.href }}) (referenced {{ link.count }} time(s))
    {%- endfor %}
{%- endif %}
{%- if statistics.days_passed_since_last_release %}
    - {{ statistics.days_passed_since_last_release }} day(s) passed between releases.
{%- endif %}\n\n

"""
# Remove leading and trailing whitespace from the changelog body.
trim = true
# Render body even when there are no releases to process.
render_always = true
postprocessors = []

[git]
# Parse commits according to the Conventional Commits specification.
# See https://www.conventionalcommits.org
conventional_commits = true
# Exclude commits that do not match the conventional commits specification.
filter_unconventional = false
require_conventional = false
split_commits = false
commit_preprocessors = []
protect_breaking_commits = false
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->🚀 Features" },
  { message = "^fix", group = "<!-- 1 -->🐛 Bug Fixes" },
  { message = "^doc", group = "<!-- 3 -->📚 Documentation" },
  { message = "^perf", group = "<!-- 4 -->⚡ Performance" },
  { message = "^refactor", group = "<!-- 2 -->🚜 Refactor" },
  { message = "^style", group = "<!-- 5 -->🎨 Styling" },
  { message = "^test", group = "<!-- 6 -->🧪 Testing" },
  { message = "^chore\\(release\\):", skip = true },
  { message = "^chore\\(deps.*\\)", skip = true },
  { message = "^chore\\(pr\\)", skip = true },
  { message = "^chore\\(pull\\)", skip = true },
  { message = "^chore|^ci", group = "<!-- 7 -->⚙️ Miscellaneous Tasks" },
  { body = ".*security", group = "<!-- 8 -->🛡️ Security" },
  { message = "^revert", group = "<!-- 9 -->◀️ Revert" },
  { message = ".*", group = "<!-- 10 -->💼 Other" },
]
filter_commits = false
fail_on_unmatched_commit = false
link_parsers = []
use_branch_tags = false
topo_order = false
topo_order_commits = true
sort_commits = "oldest"
recurse_submodules = false

# Uncomment and fill in to enable PR/MR metadata fetching (authors, PR numbers).
# For GitLab:
# [remote.gitlab]
# owner = "your-group/subgroup"
# repo = "your-project"
# # token read from GITLAB_TOKEN env var

# For GitHub:
# [remote.github]
# owner = "your-org"
# repo = "your-repo"
# # token read from GITHUB_TOKEN env var
