# git-cliff ~ configuration file
# https://git-cliff.org/docs/configuration

[changelog]
# A Tera template to be rendered for each release in the changelog.
# See https://keats.github.io/tera/docs/#introduction
header = "# Changelog\n\n"

# A Tera template to be rendered for each release in the changelog.
# See https://keats.github.io/tera/docs/#introduction
body = """
{%- macro pr_link(number) -%}
  [{{ get_env(name="HERAUT_PR_LABEL", default="") }}{{ number }}]({{ get_env(name="HERAUT_PR_URL", default="") }}{{ number }})
{%- endmacro -%}

{% macro print_commit(commit) -%}
    - {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
        {% if commit.breaking %}[**breaking**] {% endif %}\
        {{ commit.message | upper_first }} - \
        ([{{ commit.id | truncate(length=7, end="") }}]({{ get_env(name="HERAUT_COMMIT_URL", default="") }}{{ commit.id }}))\
        {% if commit.remote.username %} by @{{ commit.remote.username }}{%- endif %}\
        {%- if commit.remote.pr_number %} in {{ self::pr_link(number=commit.remote.pr_number) }}{%- endif %}{%- for link in commit.links %} ([{{ link.text }}]({{ link.href }})){%- endfor %}
{% endmacro -%}

{% if version %}\
    {% if previous.version %}\
        ## [{{ version | trim_start_matches(pat="v") }}]\
          ({{ get_env(name="HERAUT_COMPARE_URL", default="") }}{{ previous.version }}{{ get_env(name="HERAUT_COMPARE_URL_MIDDLE", default="..") }}{{ version }}) - {{ timestamp | date(format="%Y-%m-%d") }}
    {% else %}\
        ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
    {% endif %}\
{% else %}\
    ## [unreleased]
{% endif %}\

{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits
    | filter(attribute="scope")
    | sort(attribute="scope") %}
        {{ self::print_commit(commit=commit) }}
    {%- endfor %}
    {% for commit in commits %}
        {%- if not commit.scope -%}
            {{ self::print_commit(commit=commit) }}
        {% endif -%}
    {% endfor -%}
{% endfor -%}

"""
# Remove leading and trailing whitespace from the changelog body.
trim = true
# Render body even when there are no releases to process.
render_always = true
postprocessors = []

[git]
# Parse commits according to the Conventional Commits specification.
# See https://www.conventionalcommits.org
conventional_commits = true
# Exclude commits that do not match the conventional commits specification.
filter_unconventional = false
require_conventional = false
split_commits = false
commit_preprocessors = []
protect_breaking_commits = false
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->🚀 Features" },
  { message = "^fix", group = "<!-- 1 -->🐛 Bug Fixes" },
  { message = "^doc", group = "<!-- 3 -->📚 Documentation" },
  { message = "^perf", group = "<!-- 4 -->⚡ Performance" },
  { message = "^refactor", group = "<!-- 2 -->🚜 Refactor" },
  { message = "^style", group = "<!-- 5 -->🎨 Styling" },
  { message = "^test", group = "<!-- 6 -->🧪 Testing" },
  { message = "^chore\\(release\\):", skip = true },
  { message = "^chore\\(deps.*\\)", skip = true },
  { message = "^chore\\(pr\\)", skip = true },
  { message = "^chore\\(pull\\)", skip = true },
  { message = "^chore|^ci", group = "<!-- 7 -->⚙️ Miscellaneous Tasks" },
  { body = ".*security", group = "<!-- 8 -->🛡️ Security" },
  { message = "^revert", group = "<!-- 9 -->◀️ Revert" },
  { message = ".*", group = "<!-- 10 -->💼 Other" },
]
filter_commits = false
fail_on_unmatched_commit = false
link_parsers = []
use_branch_tags = false
topo_order = false
topo_order_commits = true
sort_commits = "oldest"
recurse_submodules = false

# PR/MR metadata fetching (authors, PR numbers) is enabled automatically by heraut
# when owner/repo are known from your release.platforms config, or from an explicit
# changelog.remote block (ADR-0026) — no manual config needed. Token (GITHUB_TOKEN /
# GITLAB_TOKEN / AZURE_DEVOPS_TOKEN) and repo (GITHUB_REPO / GITLAB_REPO /
# AZURE_DEVOPS_REPO) are injected from your heraut config. To override or extend, add
# [remote.github], [remote.gitlab], or [remote.azure_devops].
