version: "1"
versioning:
  strategy: semver
  tag_prefix: ""
changelog:
  output: CHANGELOG.md
commits:
  enrichment_forge: Primary GitLab
  enrichment_policy: optional
forges:
  - name: Primary GitLab
    platform: gitlab
    api_mode: rest
release:
  notes: {}
  targets:
    - forge: Primary GitLab
      draft: false
