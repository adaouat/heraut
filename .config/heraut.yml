# yaml-language-server: $schema=https://raw.githubusercontent.com/adaouat/heraut/main/schema.json
version: "1"

versioning:
  strategy: semver
  tag_prefix: "v"
  initial_version: "0.1.0"
  bump:
    mode: auto
    stay_at_v0: true

commits:
  rules:
    - name: no-claude-session
      deny: '(?i)\bClaude-Session\b'
      target: footer
      message: "Claude-Session is not allowed in commit messages"

changelog:
  output: CHANGELOG.md

forges:
  - name: github
    platform: github
    repository: adaouat/heraut

release:
  notes: {}
  targets:
    - forge: github
  assets:
    - "dist/heraut_*_linux_amd64"
    - "dist/heraut_*_linux_arm64"
    - "dist/heraut_*_darwin_amd64"
    - "dist/heraut_*_darwin_arm64"
    - "dist/heraut_*_windows_amd64.exe"
    - "dist/checksums.txt"
    - "dist/packslip.sigstore.json"
    - "dist/*.sbom.json"
    - "dist/heraut@*"
