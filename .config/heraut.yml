# yaml-language-server: $schema=https://raw.githubusercontent.com/adaouat/heraut/main/schema.json
version: "1"

versioning:
  strategy: semver
  tag_prefix: "v"
  initial_version: "0.1.0"
  bump:
    mode: auto
    stay_at_v0: true

commits:
  rules:
    - name: no-claude-session
      deny: '(?i)\bClaude-Session\b'
      target: footer
      message: "Claude-Session is not allowed in commit messages"
    - name: subject-max-72
      deny: '^.{73,}'
      target: header
      message: "commit subject must be at most 72 characters"

changelog:
  output: CHANGELOG.md

forges:
  - name: github
    platform: github
    repository: adaouat/heraut

release:
  notes: {}
  targets:
    - forge: github
  assets:
    - "dist/heraut_*_linux_amd64"
    - "dist/heraut_*_linux_arm64"
    - "dist/heraut_*_darwin_amd64"
    - "dist/heraut_*_darwin_arm64"
    - "dist/heraut_*_windows_amd64.exe"
    # T323's homebrew archive (id: homebrew, tar.gz) — the Homebrew cask's url.template
    # points at these; without them the cask's download 404s (found 2026-09-27, v0.71.0).
    - "dist/heraut_*_linux_amd64.tar.gz"
    - "dist/heraut_*_linux_arm64.tar.gz"
    - "dist/heraut_*_darwin_amd64.tar.gz"
    - "dist/heraut_*_darwin_arm64.tar.gz"
    - "dist/checksums.txt"
    - "dist/packslip.sigstore.json"
    - "dist/*.sbom.json"
    - "dist/heraut@*"
