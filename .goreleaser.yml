version: 2

project_name: heraut

before:
  hooks:
    - go mod tidy

builds:
  - id: heraut
    main: ./cmd/heraut/
    binary: "heraut_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - >-
        -s -w -X main.Version={{.Tag}}
# ADR-0013: raw binaries, no archive wrapper.
# binary and name_template share the same versioned naming so the checksum
# covers the built binary directly (ADR-0018).
archives:
  - id: default
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - binary

checksum:
  name_template: "checksums.txt"

# release.disable: true — goreleaser is build-only in the CI pipeline (ADR-0018).
# heraut owns GitHub Release creation via `heraut release --version`.
release:
  disable: true
