version: 2

project_name: heraut

before:
  hooks:
    - go mod tidy

builds:
  - id: heraut
    main: ./cmd/heraut/
    binary: heraut
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - >-
        -s -w -X main.Version={{.Tag}}
# ADR-0013: raw binaries, no archive wrapper
archives:
  - id: default
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - binary

checksum:
  name_template: "checksums.txt"

release:
  disable: false
  draft: true
