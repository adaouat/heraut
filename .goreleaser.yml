version: 2

project_name: heraut

before:
  hooks:
    - go mod tidy

builds:
  - id: heraut
    main: ./cmd/heraut/
    # Plain name so the Homebrew cask installs the binary as `heraut`; the version
    # lives in the asset name via archives.name_template below.
    binary: heraut
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - >-
        -s -w -X main.Version={{.Tag}}
# ADR-0013: raw binaries, no archive wrapper. The version lives in the asset name
# via name_template (builds.binary is plain — needed so the Homebrew cask installs
# as `heraut`); the checksum covers the binary users run directly (ADR-0018).
archives:
  - id: default
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - binary

checksum:
  name_template: "checksums.txt"

# release.disable: true — goreleaser is build-only in the CI pipeline (ADR-0018).
# heraut owns GitHub Release creation via `heraut release --version`.
release:
  disable: true

# Homebrew cask. goreleaser is build-only here (--skip=publish, ADR-0018), so it only
# *generates* dist/homebrew/Casks/heraut.rb — the release workflow pushes it to the tap
# after `heraut release` uploads the assets. The explicit url.template is required
# because release.disable means goreleaser can't derive the default download URL.
homebrew_casks:
  - repository:
      owner: adaouat
      name: homebrew-tap
    directory: Casks
    url:
      template: "https://github.com/adaouat/heraut/releases/download/{{ .Tag }}/{{ .ArtifactName }}"
    homepage: "https://github.com/adaouat/heraut"
    description: "Release management for git-based projects"
