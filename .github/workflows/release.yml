name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Override version (e.g. v1.2.3). Leave empty to use `heraut version next`."
        required: false
        default: ""
      regenerate_changelog:
        description: "Rebuild the whole changelog + re-fetch PR attribution (once, when migrating to the native generator)."
        type: boolean
        default: false

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.setup.outputs.tag }}
    permissions:
      contents: write # create GitHub Release + push tag + upload assets
      id-token: write # Sigstore signing: build provenance attestation + packslip
      attestations: write # persist build provenance attestations
    env:
      HERAUT_CHECK_UPDATE: false
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # full history for changelog generation
          token: ${{ secrets.GITHUB_TOKEN }}

      # Shared release pipeline (forge ADR-0009, ADR-0015). Composite actions run as steps of
      # this job, so this file stays the Sigstore signer of the packslip and attestations.
      # release-setup also normalizes a manual `version` input (1.2.3 -> v1.2.3) before the
      # build bakes it into main.Version, the cask URL and the Docker build-arg.
      - name: Release setup
        id: setup
        uses: adaouat/forge/.github/actions/release-setup@c9e88f2a13524bd97b63c71da00188463f03386c # v0.19.2
        with:
          gpg-private-key: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version: ${{ inputs.version }}

      - name: Release build
        uses: adaouat/forge/.github/actions/release-build@c9e88f2a13524bd97b63c71da00188463f03386c # v0.19.2
        with:
          app: heraut
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # heraut releases itself with the binary it just built, not the bootstrap one
      # release-setup installed.
      - name: Locate fresh binary
        run: echo "FRESH_BIN=dist/heraut_${VERSION#v}_linux_amd64" >> "$GITHUB_ENV"

      - name: Package Pkl builtin
        run: |
          sed -i "s/^  version = .*/  version = \"${VERSION#v}\"/" pkl/PklProject
          pkl project package pkl/ --output-path dist/ --skip-publish-check

      - name: Version sanity check
        if: env.VERSION_OVERRIDDEN == 'false'
        run: |
          FRESH=./$FRESH_BIN
          FRESH_VERSION=$($FRESH version next)
          if [[ "$FRESH_VERSION" != "$VERSION" ]]; then
            echo "Version mismatch: resolved $VERSION but fresh binary resolves $FRESH_VERSION"
            echo "A releasable commit landed between step "Resolve version" and now. Re-run the workflow."
            exit 1
          fi

      - name: Release publish
        uses: adaouat/forge/.github/actions/release-publish@c9e88f2a13524bd97b63c71da00188463f03386c # v0.19.2
        with:
          app: heraut
          github-token: ${{ secrets.GITHUB_TOKEN }}
          homebrew-tap-token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          regenerate-changelog: ${{ inputs.regenerate_changelog }}
          heraut-bin: ./${{ env.FRESH_BIN }}

  docker-build:
    runs-on: ${{ matrix.runner }}
    needs: release
    permissions:
      packages: write # push image digest to GHCR
      id-token: write # OIDC token (required by login-action)
      artifact-metadata: write # upload-artifact v7+ storage record
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Prepare platform tag
        run: echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"
        env:
          PLATFORM: ${{ matrix.platform }}

      - name: Login to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6
        with:
          images: ghcr.io/adaouat/heraut

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=ghcr.io/adaouat/heraut,push-by-digest=true,name-canonical=true,push=true
          build-args: |
            HERAUT_VERSION=${{ needs.release.outputs.tag }}
          cache-from: type=gha,scope=docker-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=docker-${{ env.PLATFORM_PAIR }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: digest-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-merge:
    runs-on: ubuntu-latest
    needs: [docker-build, release]
    permissions:
      packages: write # push final manifest list to GHCR
      id-token: write # OIDC token for build provenance attestation
      attestations: write # persist image provenance attestations
      artifact-metadata: write # download-artifact v8+ storage record
    steps:
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Login to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6
        with:
          images: ghcr.io/adaouat/heraut
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release.outputs.tag }}
            type=semver,pattern={{major}},value=${{ needs.release.outputs.tag }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          # shellcheck disable=SC2046 # word splitting is intentional: each "-t tag" must be
          # a separate arg, and the glob must expand to one path per digest file.
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/adaouat/heraut@sha256:%s ' *)

      - name: Get merged image digest
        id: digest
        run: |
          DIGEST=$(docker buildx imagetools inspect \
            --format '{{json .Manifest}}' \
            ghcr.io/adaouat/heraut:${{ steps.meta.outputs.version }} \
            | jq -r '.digest // .Digest')
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Attest image provenance
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4
        with:
          subject-name: ghcr.io/adaouat/heraut
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true
