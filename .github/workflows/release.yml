name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Override version (e.g. v1.2.3). Leave empty to use `heraut version next`."
        required: false
        default: ""

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.setup.outputs.tag }}
    permissions:
      contents: write # create GitHub Release + push tag + upload assets
      id-token: write # OIDC token for build provenance attestation
      attestations: write # persist build provenance attestations
    env:
      HERAUT_CHECK_UPDATE: false
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0 # full history for changelog generation
          token: ${{ secrets.GITHUB_TOKEN }}

      # mise + heraut bootstrap + GPG + identity + resolved version (forge ADR-0009).
      # heraut's own release/preflight below still use the freshly built $FRESH_BIN.
      - name: Release setup
        id: setup
        uses: adaouat/forge/.github/actions/release-setup@66461c2797ae849f135ab34bac2b96484d21128d # v0.7.2
        with:
          gpg-private-key: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version: ${{ inputs.version }}

      - name: Build binaries
        uses: goreleaser/goreleaser-action@5daf1e915a5f0af01ddbcd89a43b8061ff4f1a89 # v7
        with:
          version: "~> v2"
          args: release --clean --skip=publish,announce,validate
        env:
          GORELEASER_CURRENT_TAG: ${{ env.VERSION }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Collect release binaries
        # builds.binary is plain `heraut` (so the Homebrew cask installs under that
        # name), so the versioned asset names live in goreleaser's artifacts.json —
        # copy each build output to its versioned name for `heraut release` to upload.
        run: |
          jq -r '.[] | select(.type == "Binary" and (.name | startswith("heraut_"))) | "\(.path)\t\(.name)"' \
            dist/artifacts.json | while IFS=$'\t' read -r path name; do cp "$path" "dist/$name"; done
          echo "FRESH_BIN=dist/heraut_${VERSION#v}_linux_amd64" >> "$GITHUB_ENV"

      - name: Attest build provenance
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4
        with:
          subject-checksums: dist/checksums.txt

      - name: Version sanity check
        if: env.VERSION_OVERRIDDEN == 'false'
        run: |
          FRESH=./$FRESH_BIN
          FRESH_VERSION=$($FRESH version next)
          if [[ "$FRESH_VERSION" != "$VERSION" ]]; then
            echo "Version mismatch: resolved $VERSION but fresh binary resolves $FRESH_VERSION"
            echo "A releasable commit landed between step "Resolve version" and now. Re-run the workflow."
            exit 1
          fi

      - name: Preflight check
        run: ./$FRESH_BIN check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Release
        run: ./$FRESH_BIN release --version "$VERSION"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Publish Homebrew cask
        # goreleaser is build-only (--skip=publish), so it only generated the cask;
        # push it to the tap now that `heraut release` has uploaded the assets. Skips
        # gracefully if the token isn't set, so it never breaks a release.
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo "HOMEBREW_TAP_TOKEN not set — skipping cask publish."
            exit 0
          fi
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/adaouat/homebrew-tap.git" /tmp/tap
          install -D dist/homebrew/Casks/heraut.rb /tmp/tap/Casks/heraut.rb
          cd /tmp/tap
          git add Casks/heraut.rb
          git diff --cached --quiet && { echo "cask unchanged"; exit 0; }
          git commit -m "chore(deps.heraut): ${VERSION}"
          git push

  docker-build:
    runs-on: ${{ matrix.runner }}
    needs: release
    permissions:
      packages: write # push image digest to GHCR
      id-token: write # OIDC token (required by login-action)
      artifact-metadata: write # upload-artifact v7+ storage record
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Prepare platform tag
        run: echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> $GITHUB_ENV
        env:
          PLATFORM: ${{ matrix.platform }}

      - name: Login to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6
        with:
          images: ghcr.io/adaouat/heraut

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=ghcr.io/adaouat/heraut,push-by-digest=true,name-canonical=true,push=true
          build-args: |
            HERAUT_VERSION=${{ needs.release.outputs.tag }}
          cache-from: type=gha,scope=docker-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=docker-${{ env.PLATFORM_PAIR }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: digest-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-merge:
    runs-on: ubuntu-latest
    needs: [docker-build, release]
    permissions:
      packages: write # push final manifest list to GHCR
      id-token: write # OIDC token for build provenance attestation
      attestations: write # persist image provenance attestations
      artifact-metadata: write # download-artifact v8+ storage record
    steps:
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Login to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6
        with:
          images: ghcr.io/adaouat/heraut
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release.outputs.tag }}
            type=semver,pattern={{major}},value=${{ needs.release.outputs.tag }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/adaouat/heraut@sha256:%s ' *)

      - name: Get merged image digest
        id: digest
        run: |
          DIGEST=$(docker buildx imagetools inspect \
            --format '{{json .Manifest}}' \
            ghcr.io/adaouat/heraut:${{ steps.meta.outputs.version }} \
            | jq -r '.digest // .Digest')
          echo "digest=$DIGEST" >> $GITHUB_OUTPUT

      - name: Attest image provenance
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4
        with:
          subject-name: ghcr.io/adaouat/heraut
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true
