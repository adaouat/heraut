name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Lint + test come from forge's shared reusable workflow (ADR-0006).
  ci:
    uses: adaouat/forge/.github/workflows/go-ci.yml@5a8de75f0c08d6ca58bea0f59617282a98f9f2b6 # v0.6.1
    with:
      coverage-threshold: 85

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
      - name: Setup Mise
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4
      - name: Build
        run: go build ./cmd/heraut/
      - name: Check GoReleaser config
        run: goreleaser check

  # The reusable `ci` job only runs golangci-lint, but all linting is configured in hk
  # (.config/hk/config.pkl) — hadolint, actionlint, yamlfmt, typos, pkl, go fmt, … — and the
  # local pre-commit hook only sees staged files, so those never reach CI. Run the full hk
  # set here (check mode, all files; --skip-step golangci_lint avoids re-running it). hk's
  # per-step file selection scopes each linter (hadolint → Dockerfile*, actionlint → workflows).
  hk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Setup Mise
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4
      - name: hk check
        run: hk check --all --check --skip-step golangci_lint
