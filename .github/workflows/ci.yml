name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: jdx/mise-action@v4

      - name: Lint
        run: golangci-lint run ./...

      - name: Test
        run: go test ./...

      - name: Build
        run: go build ./cmd/heraut/
