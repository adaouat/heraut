# ─────────────────────────────────────────────────────────────────────────────
# heraut — annotated sample configuration
#
# This file documents every supported field. Copy the blocks you need into
# .heraut.yml (or .config/heraut.yml) and delete the rest.
#
# Full field reference: docs/specs/02-configuration.md
# Versioning strategies: docs/specs/04-versioning.md
# ─────────────────────────────────────────────────────────────────────────────

# yaml-language-server: $schema=https://raw.githubusercontent.com/adaouat/heraut/main/schema.json

# Schema version. Must be "1".
version: "1"

# ── versioning ────────────────────────────────────────────────────────────────
#
# Four strategies are available. Pick one; fields irrelevant to your strategy
# are ignored. See docs/specs/04-versioning.md for the full strategy reference.

versioning:
  # strategy — required. One of:
  #   semver         SemVer inferred from conventional commits (or manual bump)
  #   calver         Calendar versioning (clock-derived period + PATCH counter)
  #   semver-per-env SemVer with a separate tag namespace per environment
  #   calver-per-env CalVer with a separate tag namespace per environment
  strategy: semver

  # tag_prefix — string prepended to every version tag.
  # "v" produces v1.2.3. Set to "" (or omit) for bare tags like 1.2.3.
  tag_prefix: "v"

  # initial_version — version used when no matching tags exist yet.
  # semver and semver-per-env only.
  initial_version: "0.1.0"

  # bump — how to determine the version increment. semver only (semver-per-env
  # uses each environment's own bump: auto/promote instead — see environments below).
  #   auto   inspect conventional-commit types since the last tag
  #   manual require --version on the CLI (heraut release --version / version next --version)
  bump: auto

  # tag_type — git tag type. Omit for the default (annotated).
  #   annotated   created with -a; carries tagger, timestamp, message
  #   lightweight bare ref; no metadata (useful for ephemeral env tags)
  # tag_type: lightweight

  # ── CalVer fields (strategy: calver or calver-per-env) ───────────────────
  #
  # format — required for calver / calver-per-env.
  # Tokens: YYYY MM DD WW QQ SS SPRINT PATCH
  # PATCH is required and must be last. At least one calendar token is required.
  #
  #   YYYY.MM.PATCH      2026.01.3
  #   YYYY.MM.DD.PATCH   2026.01.15.0
  #   YYYY.WW.PATCH      2026.04.1   (ISO week)
  #   YYYY.QQ.PATCH      2026.1.0    (quarter)
  #   YYYY.SS.PATCH      2026.1.0    (semester)
  #   YYYY.SPRINT.PATCH  2026.5.2    (sprint counter, not clock-derived)
  #   YYYY.PATCH         2026.7
  #
  # format: "YYYY.MM.PATCH"

  # sprint — current sprint counter. Required when format contains SPRINT.
  # Not clock-derived: advance it with `heraut version sprint bump`.
  # sprint: 1

  # ── Per-env fields (strategy: semver-per-env or calver-per-env) ──────────
  #
  # tag_format — shared tag template for all environments. Must contain {version}.
  # Typically also contains {env} to create separate namespaces per environment.
  # Can be overridden per environment in the environments block below.
  # tag_format: "{env}/{version}"

# ── environments ───────────────────────────────────────────────────────────────
#
# Required for semver-per-env and calver-per-env strategies.
# One entry per deployment environment.
# Versioning fields drive version resolution; content fields override changelog/release.
# Using environments with semver or calver is a hard error.
#
# environments:
#   dev:
#     # bump mode for this environment:
#     #   auto    infer from conventional commits since the last tag in this namespace
#     #   promote copy the version from another environment's latest tag
#     bump: auto
#
#     # tag_format override for this environment only (overrides versioning.tag_format).
#     # tag_format: "dev/{version}"
#
#     # branch restriction: heraut refuses to run here unless this branch is active.
#     # omit or leave empty for no restriction (the default).
#     # branch: develop
#
#     # disable_changelog: skip changelog generation for this environment.
#     # disable_changelog: true
#
#     # disable_release: turn off the entire release: behavior (notes + publish,
#     # together) for this environment.
#     # disable_release: true
#
#     # changelog override — replace root changelog config for this environment.
#     # changelog:
#     #   tag_pattern: "^dev/"
#
#     # release overrides — release.notes deep-merges over root, release.targets
#     # replaces the root list entirely for this env (ADR-0043/ADR-0044). Both
#     # still generate + publish together — see the release block below.
#     # release:
#     #   targets:
#     #     - forge: gitlab-saas
#
#   staging:
#     bump: promote
#     source: dev        # environment to promote from
#     disable_changelog: true
#     disable_release: true
#
#   prod:
#     bump: promote
#     source: staging    # staging must exist and have a tag before prod can promote
#     release:
#       targets:
#         - forge: gitlab-saas
#         - forge: github

# ── commits ───────────────────────────────────────────────────────────────────
#
# Single source of truth for commit semantics and enrichment (ADR-0033). The type
# set here is used by BOTH `heraut commit verify`/`create` AND the native renderer's
# changelog section taxonomy.
# commits:
#   # types — conventional-commit type rules, MERGED over the built-in defaults by
#   # name (feat → 🚀 Features, fix → 🐛 Bug Fixes, …). List only what you change:
#   # add a render label / order, or remove a default. Listing a type does NOT
#   # restrict the allow-list to only the listed types — use remove to drop one.
#   types:
#     - name: feat
#       order: 1
#       render: "🚀 Features"        # rendered as a "### 🚀 Features" section heading
#       description: "A new feature" # one-line hint in the commit-create wizard picker
#     - name: docs
#       # no render → the type joins the catch-all "💼 Other" section (like the default build type)
#     - name: build
#       remove: true                # drop build from the verify allow-list
#   types_heading_level: 3          # heading depth (number of #) for type sections
#   # scopes — allowed scopes (objects), MERGED over built-in defaults (deps, deps-dev,
#   # release). Offered by `heraut commit create`; enforced by `heraut commit verify` only
#   # when scopes_restricted is true. `description` shows in the wizard picker; `remove` drops
#   # a default scope.
#   scopes:
#     - { name: cmd, description: "CLI commands" }
#     - { name: config }
#     - { name: versioning }
#     - { name: ui }
#   scopes_restricted: false
#   # enrichment_forge — references a forges[].name (see the forges block below) used
#   # as the PR/MR metadata source for changelog and release-notes generation (ADR-0043).
#   enrichment_forge: gitlab-saas
#   # enrichment_policy — whether generators fetch PR/MR metadata (author, PR number) to
#   # enrich changelog/release-notes, sourced from enrichment_forge:
#   # required | optional (default) | disabled. The --offline flag forces 'disabled' for
#   # a single run.
#   enrichment_policy: optional
#   # tickets — link issue-tracker references found in commit messages. Each entry's
#   # regex is matched; {ticket} in the URL is the first capture group (or the whole
#   # match), and the link label is the matched text.
#   tickets:
#     - pattern: '[A-Z]+-[0-9]+'                          # Jira/Linear: PROJ-123
#       url: 'https://acme.atlassian.net/browse/{ticket}'
#     - pattern: 'GH-([0-9]+)'                            # GitHub issues: GH-123
#       url: 'https://github.com/acme/app/issues/{ticket}'

# ── rendering ─────────────────────────────────────────────────────────────────
#
# Content output rules (ADR-0033).
# rendering:
#   # excludes — drop matched commits from the rendered changelog/release-notes.
#   # Set exactly one of type or regex per entry. Independent of commits.types
#   # remove (which governs the verify allow-list, not the rendered output).
#   excludes:
#     - regex: '^chore\(deps.*\)'
#     - type: chore
#   # templates — override built-in native template blocks (ADR-0037). native only.
#   # Each value is a Go text/template snippet; unset blocks keep their built-in.
#   # Overridable keys: header, group, commit, contributor, footer (+ the structural
#   # contributors, stats, changelog, release-notes for whole-section control).
#   # Data & funcs: see the native template contract in the docs. Precedence:
#   # built-in -> rendering.templates (global) -> <driver>.rendering.templates ->
#   # environments.<env>.<driver>.rendering.templates -> <driver>.template file.
#   templates:
#     commit: '- {{ .Description }} ({{ .ShortHash }})'
#     contributor: '* @{{ .Author.Username }} — first contribution 🎉'
#     footer: "\n_Generated by [heraut]({{ .Heraut.URL }}) {{ .Heraut.Version }}._"

# ── forges ────────────────────────────────────────────────────────────────────
#
# Code-hosting platforms heraut talks to (ADR-0043/ADR-0044): connection/identity
# only. What to publish (draft/assets) lives in release.targets below; the PR/MR
# enrichment source is commits.enrichment_forge above. Optional in the common case:
# heraut auto-detects a single forge from the CI environment or the git remote
# when this block is omitted (zero-config publishing).
forges:
  # ── GitHub ───────────────────────────────────────────────────────────────
  - name: github # referenced by release.targets[].forge and commits.enrichment_forge
    platform: github # github | gitlab | azure_devops

    # repository — owner/repo on GitHub. Required.
    repository: acme/widget

    # token_env — env var holding a GitHub token with contents:write scope.
    # Defaults to GH_TOKEN if omitted.
    token_env: GH_TOKEN

    # base_url — web base URL of the forge instance. Defaults to
    # https://github.com (GitHub) / https://gitlab.com (GitLab).
    # Self-hosted (non-default) values are supported (ADR-0025).
    # base_url: https://github.com

# ── GitLab ───────────────────────────────────────────────────────────────
# - name: gitlab-saas
#   platform: gitlab
#   project: group/subgroup/project  # gitlab: namespace[/subgroup]/repo
#   # repository: acme/widget        # github / azure_devops: owner/repo (or repo name)
#   # base_url: https://gitlab.example.com  # self-hosted host override
#   # api_url: https://gitlab.example.com/api  # API host override, when it differs from base_url
#   api_mode: rest              # rest (default) | graphql
#   # token_env: GITLAB_TOKEN   # defaults per type when unset

# ── Multiple instances of the same forge type (ADR-0025/ADR-0044) ─────────────
# Declare multiple forges: entries (distinct name:, base_url:, token_env:) and
# reference each from its own release.targets entry to publish to both instances:
# forges:
#   - name: gitlab-saas
#     platform: gitlab
#     project: acme/widget
#   - name: gitlab-internal
#     platform: gitlab
#     project: tools/widget-mirror
#     base_url: https://gitlab.example.com
#     token_env: GITLAB_INTERNAL_TOKEN
# release:
#   targets:
#     - forge: gitlab-saas
#     - forge: gitlab-internal

# ── changelog ─────────────────────────────────────────────────────────────────
#
# Omit this block if you do not want heraut to manage a CHANGELOG.md.
# When present, `heraut release` writes the file, commits it, and then tags.

changelog:
  # output — path where the changelog file is written.
  output: CHANGELOG.md

  # tag_pattern — regex (Go regexp syntax) selecting this scope's release tags. Handy
  # with prefixed-tag / per-env strategies to keep generation scoped to one namespace.
  # (Per-env strategies auto-derive this from tag_format — set it only to override.)
  #   semver bare tags: "^v[0-9]"
  #   per-env prod:     "^prod/"
  # tag_pattern: "^v[0-9]"

  # template — path to a full native template file (Go text/template), parsed on top
  # of the built-in blocks: it may redefine the document root and/or any block, and is
  # authored with real editor tooling (highlighting, no YAML escaping). Parsed last, so
  # it wins over inline rendering.templates for whatever it defines. native only (ADR-0037).
  # template: .config/heraut/changelog.tmpl

  # rendering — per-driver overrides (template snippets + excludes), deep-merged over the
  # global rendering block. native only. Use this to reformat one block for the changelog
  # without touching release notes (or vice-versa). See the global rendering block above.
  # rendering:
  #   templates:
  #     header: "# Changelog\n\nAll notable changes to this project.\n"

  # PR/MR enrichment for the changelog's commit history is sourced from the top-level
  # forges: block plus commits.enrichment_forge / commits.enrichment_policy above — see
  # the forges block for pinning a specific host when ambient detection is ambiguous.

# ── release ───────────────────────────────────────────────────────────────────
#
# Omit this block if you do not publish releases to any platform. Presence — even
# empty (release: {}) — always means "generate release notes and publish them,"
# together; there is no config shape that gets one without the other (ADR-0046).

release:
  # notes — rendering overrides for the release-page description text, generated
  # natively. Omit entirely to use native's defaults (equivalent to `notes: {}`).
  #
  # tag_pattern, template — same semantics as the changelog block above.
  # notes:
  #   tag_pattern: "v[0-9]*"

  # assets — glob patterns for files to attach to the release, applied to all targets.
  # Globs are expanded at release time; a pattern matching nothing emits a warning
  # but does not abort the release.
  # Precedence: if a target also defines assets:, the target-level list takes full
  # precedence and release.assets is ignored for that target. Use release.assets as
  # a shared default; use target.assets for target-specific overrides.
  # assets:
  #   - "dist/myapp_*_linux_amd64"
  #   - "dist/myapp_*_linux_arm64"
  #   - "dist/myapp_*_darwin_amd64"
  #   - "dist/myapp_*_darwin_arm64"
  #   - "dist/myapp_*_windows_amd64.exe"
  #   - "dist/checksums.txt"

  # targets — release publish destinations, each referencing a forges[].name (see
  # the forges block above). Omitting targets entirely publishes to the single
  # resolved forge with default options (zero-config publishing) — see ADR-0044.
  targets:
    # forge — references a forges[].name. Optional when exactly one forge is
    # configured (or auto-detected); required when more than one is configured.
    - forge: github
